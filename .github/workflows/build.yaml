name: Build Nimbus (Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]          # ← добавили триггер по тегам
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write        # ← нужно для создания релиза
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconsole --onedir --name Nimbus `
            --icon=assets\icon.ico `
            --add-data "assets;assets" `
            --collect-all cryptography `
            nimgui.pyw

      # Упаковываем папку dist/Nimbus в один zip — удобнее скачивать
      - name: Zip build
        run: Compress-Archive -Path dist\Nimbus\* -DestinationPath Nimbus-Windows.zip
        shell: pwsh

      # Артефакт для истории Actions (остаётся на 30 дней)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nimbus-Windows
          path: Nimbus-Windows.zip
          retention-days: 30

      # Если это тег v* — создаём/обновляем GitHub Release
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Nimbus-Windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}